services:
  kpi-api:
    build: ./kpi_api
    container_name: kpi-api
    ports:
      - "8000:8000"
    networks:
      - hr-process-helper

  mcp-server:
    build: ./mcp_server
    container_name: mcp-server
    ports:
      - "8001:8001"
    networks:
      - hr-process-helper

  agent-system:
    build: ./agent_system
    container_name: agent-system
    ports:
      - "8002:8002"
    networks:
      - hr-process-helper
    env_file:
      - ../.env

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:8080"
    networks:
      - hr-process-helper  

networks:
  hr-process-helper:
    driver: bridge